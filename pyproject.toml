[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "k11-api-security-qa-mcp"
version = "0.1.0"
description = "MCP server and CI tool for API security testing as release evidence: OWASP API Security Top 10 tests generated from your OpenAPI spec (BOLA, broken auth, mass assignment, data exposure, admin functions), and scanner SARIF judged against a baseline and expiring risk acceptances."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "K11 Software Solutions" }]
requires-python = ">=3.10"
keywords = ["mcp", "api-security", "owasp", "bola", "idor", "security-testing", "sarif", "openapi", "qa", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = ["k11-api-functional-qa-mcp>=0.1.1,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.urls]
Homepage = "https://github.com/K11-Software-Solutions/k11techlab-api-security-qa-mcp"
Issues = "https://github.com/K11-Software-Solutions/k11techlab-api-security-qa-mcp/issues"

[project.scripts]
k11-api-security-qa-mcp = "k11_api_security_qa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k11_api_security_qa"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
